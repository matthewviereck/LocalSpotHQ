# Daily build/deploy of the LocalSpot areas via the Python pipeline.
# This is THE production builder (cutover 2026-07-16): the legacy Hostinger
# PHP cron (deploy/auto_update.php) sees the synced deploy/CUTOVER marker and
# now only sends the Friday digest email.
#
# Required repo secrets: HOSTINGER_SSH_KEY (dedicated deploy key, NOT a
# personal key), HOSTINGER_HOST, HOSTINGER_USER, HOSTINGER_PORT. Until they
# are set, the deploy step skips itself and the run only validates the build.

name: Build and deploy areas

on:
  schedule:
    - cron: '15 10 * * *' # daily, 10:15 UTC = 6:15 AM ET
  workflow_dispatch:

concurrency:
  group: build-deploy-phoenixville
  cancel-in-progress: false

# The build writes data/*/slug_registry.json (which URL each event has been
# published under) and the workflow commits it back - see "Persist slug
# registry". Without that write, every rename would still 404 the next day.
permissions:
  contents: write

env:
  # The pipeline's date math (today/tomorrow/weekend windows) uses local time;
  # runners are UTC by default, which would mislabel events for 4-5 h a day.
  TZ: America/New_York
  PHX_DIR: domains/localspothq.com/public_html/phoenixville
  WC_DIR: domains/localspothq.com/public_html/west-chester

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Prebuild Tailwind CSS
        # Regenerated every run so the committed assets/app.css fallback can
        # never drift from the template's classes
        run: npx --yes tailwindcss@3.4.17 --content templates/app_template.html -o assets/app.css --minify

      - name: Test URL-stability rules
        # pipeline/slugs.py decides which event URLs live, redirect or die;
        # a regression there 404s ranked pages, so it gates the build.
        run: python -m unittest tests.test_slugs

      - name: Build Phoenixville
        run: python pipeline/run.py --area phoenixville

      - name: Build West Chester
        run: python pipeline/run.py --area west_chester

      - name: Build hub page
        run: python pipeline/hub.py

      - name: Verify build output
        run: |
          test -s output/phoenixville/index.html
          test -s output/phoenixville/this-weekend/index.html
          test -s output/phoenixville/events.ics
          test -s output/west_chester/index.html
          test -s output/index.html
          test -s output/sitemap.xml
          test -s output/robots.txt
          # Retired event URLs must resolve to a redirect/stub/410, never 404
          test -s output/phoenixville/.htaccess
          test -s output/west_chester/.htaccess
          test -s data/phoenixville/slug_registry.json
          test -s data/west_chester/slug_registry.json
          # Every generated page must carry the GA tag, or analytics goes blind
          # on exactly the pages organic search lands on.
          for p in output/phoenixville/this-weekend/index.html \
                   output/phoenixville/guides/index.html; do
            grep -q 'G-FXMDYPK8KZ' "$p" || { echo "GA tag missing from $p"; exit 1; }
          done
          # Refuse to ship a gutted build (e.g. every scraper failed and the
          # committed fallbacks were missing). West Chester has one scraper
          # plus recurring events, so its floor is lower.
          python -c "
          import json
          phx = json.load(open('data/phoenixville/generated/events_formatted.json', encoding='utf-8'))
          wc = json.load(open('data/west_chester/generated/events_formatted.json', encoding='utf-8'))
          assert len(phx) >= 20, f'Phoenixville: only {len(phx)} events - refusing to deploy'
          assert len(wc) >= 8, f'West Chester: only {len(wc)} events - refusing to deploy'
          print(f'Phoenixville: {len(phx)} events | West Chester: {len(wc)} events')
          " | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Deploy to Hostinger
        env:
          SSH_KEY: ${{ secrets.HOSTINGER_SSH_KEY }}
          HOST: ${{ secrets.HOSTINGER_HOST }}
          DEPLOY_USER: ${{ secrets.HOSTINGER_USER }}
          PORT: ${{ secrets.HOSTINGER_PORT }}
        run: |
          if [ -z "$SSH_KEY" ]; then
            echo 'HOSTINGER_* secrets not set - build validated, deploy skipped.' | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          # ssh-keyscan is the flakiest call in this step, and it used to fail
          # in the worst possible way: stderr went to /dev/null and `bash -e`
          # killed the step, so a transient blip produced a red run with ZERO
          # output to diagnose (hit on 2026-08-29, passed on a plain re-run).
          # Now: retry with backoff, judge success on actually having a host
          # key rather than on exit code alone, and if it really is down, say
          # so instead of exiting mute.
          KEYSCAN_ERR="$(mktemp)"
          for attempt in 1 2 3; do
            if ssh-keyscan -p "$PORT" "$HOST" > ~/.ssh/known_hosts 2>"$KEYSCAN_ERR" \
               && [ -s ~/.ssh/known_hosts ]; then
              if [ "$attempt" -gt 1 ]; then
                echo "ssh-keyscan succeeded on attempt $attempt"
              fi
              break
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "::error::ssh-keyscan could not retrieve the host key after 3 attempts - deploy aborted before any file was copied"
              echo "--- ssh-keyscan stderr ---"
              cat "$KEYSCAN_ERR"
              echo "--------------------------"
              exit 1
            fi
            echo "ssh-keyscan attempt $attempt failed (retrying in $((attempt * 5))s):"
            sed 's/^/  /' "$KEYSCAN_ERR"
            sleep "$((attempt * 5))"
          done
          RSH="ssh -p $PORT -i $HOME/.ssh/deploy_key"
          DOCROOT="${PHX_DIR%/*}"

          $RSH "$DEPLOY_USER@$HOST" "mkdir -p ~/$PHX_DIR ~/$WC_DIR"
          rsync -rtz --delete -e "$RSH" output/phoenixville/ "$DEPLOY_USER@$HOST:$PHX_DIR/"
          rsync -rtz --delete -e "$RSH" output/west_chester/ "$DEPLOY_USER@$HOST:$WC_DIR/"

          # The signup form POSTs to /subscribe.php at the site root
          rsync -tz -e "$RSH" web/subscribe.php "$DEPLOY_USER@$HOST:$DOCROOT/subscribe.php"

          # Hub page, rebuilt each run so its per-area counts stay honest, plus
          # the sitemap index and robots.txt that point crawlers at every area
          # sitemap. Individual files, no --delete: everything else at the
          # docroot (images, .htaccess, submit.html) is managed by hand.
          rsync -tz -e "$RSH" output/index.html "$DEPLOY_USER@$HOST:$DOCROOT/index.html"
          rsync -tz -e "$RSH" output/sitemap.xml "$DEPLOY_USER@$HOST:$DOCROOT/sitemap.xml"
          rsync -tz -e "$RSH" output/robots.txt "$DEPLOY_USER@$HOST:$DOCROOT/robots.txt"

          # Retired parallel-run dir from before cutover (no-op once gone)
          $RSH "$DEPLOY_USER@$HOST" "rm -rf ~/$DOCROOT/phoenixville-beta"

          # Subscriber list lives one level above the docroot (never web-served)
          SUBS=$($RSH "$DEPLOY_USER@$HOST" "grep -c '\"email\"' domains/localspothq.com/subscribers.json 2>/dev/null || echo 0")
          echo "Email subscribers: $SUBS" | tee -a "$GITHUB_STEP_SUMMARY"
          echo "Deployed: https://www.localspothq.com/phoenixville/ and https://www.localspothq.com/west-chester/" | tee -a "$GITHUB_STEP_SUMMARY"

      # The registry is the memory that keeps event URLs stable across renames.
      # It only helps if the next run can read what this run assigned, so it
      # goes back to master. Runs after deploy so the committed state matches
      # what is live; before the health check so a dark venue can't lose it.
      - name: Persist slug registry
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/*/slug_registry.json
          if git diff --cached --quiet; then
            echo "Slug registry unchanged" | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git commit -m "Update slug registry ($(date +%F))"
          # Discovery commits land on master at other times of day; rebase
          # over them rather than fail the push.
          for attempt in 1 2 3; do
            git pull --rebase origin master && git push origin HEAD:master && break
            [ "$attempt" -eq 3 ] && { echo "::error::could not push slug registry"; exit 1; }
            sleep 15
          done
          echo "Slug registry committed" | tee -a "$GITHUB_STEP_SUMMARY"

      # Deliberately AFTER the deploy. Every scraper falls back to its last-good
      # file when a fetch fails, so a permanently broken one is otherwise
      # invisible - Uptown Knauer 403'd for five months and nothing said so.
      # A dark venue should turn the run red, but it must not stop ~200 good
      # events from shipping, so this runs once the site is already live.
      - name: Scraper health check
        run: python scripts/check_scraper_health.py
